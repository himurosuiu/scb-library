<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クラウド管理 | SCB Library</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../admin/admin.css"><style>.cloud-wrap{max-width:1050px;margin:6rem auto 3rem;padding:1.2rem}.cloud-box{background:#fffaf5;border:1px solid #c9b8a6;border-radius:14px;padding:1.4rem;margin:1.2rem 0}.cloud-box button{margin:.3rem}.cloud-box input,.cloud-box select{width:100%;padding:.6rem;max-width:500px}.cloud-grid{display:grid;grid-template-columns:1fr 2fr;gap:1rem}@media(max-width:700px){.cloud-grid{grid-template-columns:1fr}}#cloudFields label{display:block;margin:.7rem 0}#cloudFields input{max-width:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><div class="prototype-ribbon">v0.7 CLOUD ALPHA ・ 未設定の場合は利用できません ・ 本番公開ではありません</div><main class="cloud-wrap"><p class="eyebrow">SALON CHERRY BLOSSOM · CLOUD STUDIO</p><h1>人物管理 · クラウド草稿</h1><p>Discord で認証し、権限が確認できた人物の編集差分だけをクラウドに保存します。サイトと VRChat World への公開はまだ行いません。</p><div class="cloud-box"><h2>認証</h2><p id="cloudUser" role="status">設定確認中…</p><button id="login" type="button">Discord でログイン</button><button id="logout" type="button" hidden>ログアウト</button><p id="privilege"></p></div><div class="cloud-grid"><div class="cloud-box"><label for="character">編集対象</label><select id="character" disabled><option>ログインが必要です</option></select><p id="revision"></p></div><div class="cloud-box"><h2 id="personTitle">人物を選択してください</h2><form id="cloudFields"></form><div><button type="button" id="saveCloud" disabled>クラウド草稿を保存</button><button type="button" id="discardFields" disabled>変更を破棄</button></div><p id="cloudStatus" role="status" aria-live="polite"></p><pre id="conflictOutput" hidden></pre></div></div><p><a href="../admin/">ローカル編集ツール（非認証）</a> · <a href="../characters/">人物アーカイブ</a></p></main><script src="config.js"></script><script type="module" src="studio.js"></script></body></html>

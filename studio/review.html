<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>草稿の審査 | SCB Library</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../admin/admin.css"><style>
.cloud-wrap{max-width:1050px;margin:6rem auto 3rem;padding:1.2rem}.cloud-box{background:#fffaf5;border:1px solid #c9b8a6;border-radius:14px;padding:1.4rem;margin:1.2rem 0}.cloud-box button{margin:.3rem}
table.diff{width:100%;border-collapse:collapse;margin:.6rem 0}table.diff th,table.diff td{border-bottom:1px solid #e2d6c8;padding:.5rem .6rem;text-align:left;font-size:.95rem;vertical-align:top;overflow-wrap:anywhere}table.diff th{color:#8a6a55;font-weight:600}
td.before{color:#7b6b5e}td.after{background:#f3fbf5}tr.conflict td{background:#fdeeee}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-size:.8rem;margin-right:.4rem;border:1px solid #c9b8a6;background:#fff}.badge.bad{border-color:#c77;color:#a0343a;background:#fdeeee}.badge.mute{color:#8a7a6b}
.muted{color:#8a7a6b}.err{color:#a0343a}.ok{color:#2d6a4f}.sw{display:inline-block;width:.9em;height:.9em;border:1px solid #999;border-radius:3px;vertical-align:-.1em;margin-right:.35em}
.thumb{display:block;max-width:90px;max-height:110px;margin-top:.3rem;border:1px solid #e2d6c8;border-radius:6px}
.danger{background:#fff;border:1px solid #c99;color:#a0343a}.draft h3{margin:.2rem 0}.sub{font-size:.9rem;color:#8a7a6b}
@media(max-width:700px){table.diff th:nth-child(2),table.diff td:nth-child(2){display:none}}
</style></head><body>
<div class="prototype-ribbon">SUPER ADMIN ONLY ・ 草稿の審査 ・ 承認しても公開サイトと World はまだ変わりません</div>
<main class="cloud-wrap">
<p class="eyebrow">SALON CHERRY BLOSSOM · REVIEW</p>
<h1>草稿の審査</h1>
<p>編集者が保存した草稿を確認し、<strong>承認</strong>（データベースへ反映）または<strong>却下</strong>します。承認後、サイトと VRChat World に反映するには <code>tools/scb_publish/publish_from_db.py</code> を実行して公開してください。</p>

<div class="cloud-box"><h2>認証</h2><p id="who" role="status">設定確認中…</p><button id="login" type="button">Discord でログイン</button><button id="logout" type="button" hidden>ログアウト</button><p id="priv"></p></div>

<div id="panel" hidden>
 <div class="cloud-box"><button id="reload" type="button">一覧を更新</button> <span id="count" class="muted"></span><p id="msg" role="status" aria-live="polite"></p></div>
 <div id="drafts"></div>
 <p id="none" class="muted" hidden>審査待ちの草稿はありません。</p>
</div>
<p><a href="./">クラウド草稿</a> · <a href="./roles.html">編集者の割り当て</a> · <a href="../characters/">人物アーカイブ</a></p>
</main>
<script src="config.js"></script><script type="module" src="review.js"></script></body></html>
